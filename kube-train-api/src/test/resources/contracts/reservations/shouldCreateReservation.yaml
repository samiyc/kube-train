# Contrat : le producer DOIT créer une réservation et retourner 201
# Les champs dynamiques (reservationId, wagon, departureTime) sont validés par regex.
#
# 🎯 body: vs matchers: — deux niveaux de vérification
#  - body:        → valeurs d'exemple retournées par le stub WireMock (côté consumer)
#                   Ce sont des valeurs concrètes, pas les valeurs réelles de prod.
#  - matchers:    → patterns regex pour le test auto-généré du producer.
#                   Vérifient que la vraie API respecte le FORMAT, pas la valeur exacte.
#
# Sans body: pour un champ dynamique → le stub WireMock ne retourne pas ce champ du tout.
# Avec body: + matcher: → le stub retourne l'exemple, le test producer vérifie le format réel.
description: "Crée une réservation pour un train existant"
name: shouldCreateReservation
request:
  method: POST
  url: /reservations
  headers:
    Content-Type: application/json
  body:
    trainId: "TGV-7042"
    passengerName: "Jean Dupont"
    passengerEmail: "jean@example.com"
response:
  status: 201
  headers:
    Content-Type: application/json
  body:
    status: "CONFIRMED"
    trainId: "TGV-7042"
    price: 29.9
    reservationId: "RES-EFB30294"
    wagon: "Wagon 4"
    departureTime: "2026-05-18T12:00:00Z"
  matchers:
    body:
      - path: $.reservationId
        type: by_regex
        value: 'RES-[A-Z0-9]{8}'
      - path: $.wagon
        type: by_regex
        value: 'Wagon \d+'
      - path: $.departureTime
        type: by_regex
        value: '\d{4}-\d{2}-\d{2}T.*'
    headers:
      - key: Location
        regex: '/reservations/RES-[A-Z0-9]{8}'
