# Profil GCP — actif sur GKE (SPRING_PROFILES_ACTIVE=postgres,gcp)

# Projet GCP : source de vérité pour les clients Pub/Sub, Cloud SQL, etc.
gcp.project-id=kube-train-project

# Kafka désactivé : remplacé par Pub/Sub en profil gcp.
# On exclut l'autoconfiguration pour éviter toute tentative de connexion à localhost:9092.
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
