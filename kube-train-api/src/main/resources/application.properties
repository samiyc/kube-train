spring.application.name=kube-train-api

# --- Kafka (activé uniquement avec KAFKA_ENABLED=true) ---
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# --- Base de données ---
# Par défaut : JPA, DataSource et Flyway sont DÉSACTIVÉS pour ne pas nécessiter de BDD locale.
# Activer avec : SPRING_PROFILES_ACTIVE=postgres (voir application-postgres.properties)
#
# 🎯 Spring Boot 4 a réorganisé les packages d'autoconfiguration dans des modules dédiés :
#   - DataSource      → spring-boot-jdbc   (org.springframework.boot.jdbc.autoconfigure)
#   - JPA/Hibernate   → spring-boot-hibernate (org.springframework.boot.hibernate.autoconfigure)
#   - Spring Data JPA → spring-boot-data-jpa  (org.springframework.boot.data.jpa.autoconfigure)
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration

# --- Actuator / Observabilité (J4 — Les 3 piliers) ---
# Expose health (probes K8s), prometheus (Micrometer → Prometheus), info (version)
# 🎯 Micrometer = facade de métriques vendor-neutral (comme SLF4J pour les logs)
#    micrometer-registry-prometheus → format texte Prometheus sur /actuator/prometheus
#    En prod : Prometheus scrape ce endpoint toutes les 15s, Grafana visualise
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.prometheus.access=unrestricted
# /actuator/info → affiche version et nom de l'app (utile en debug prod)
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
