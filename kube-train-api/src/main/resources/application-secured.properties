# --- OAuth2 / Keycloak (profil "secured") ---
# Activé avec : SPRING_PROFILES_ACTIVE=secured (ou postgres,secured)
#
# 🎯 L'API agit en "Resource Server" : elle VALIDE les JWT, elle ne les émet pas.
#    L'issuer-uri pointe vers Keycloak (local) ou tout autre OIDC provider (Auth0, Google).
#    Spring Boot télécharge automatiquement les clés publiques (JWKS) pour vérifier la signature.

# Keycloak local (docker-compose)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/kube-train

# GKE : remplacer par l'URL Keycloak déployée ou un IdP cloud
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
