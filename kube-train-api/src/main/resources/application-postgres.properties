# Profil "postgres" — actif sur GKE via SPRING_PROFILES_ACTIVE=postgres
# En local : docker compose up -d postgres, puis ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Ce fichier écrase les exclusions d'autoconfiguration du profil default :
# spring.autoconfigure.exclude= (vide) réactive DataSource, JPA et Flyway.

# --- Désactiver les exclusions du profil default ---
# Une valeur vide écrase la liste d'exclusions définie dans application.properties
# → DataSource, JPA et Flyway sont réactivés
spring.autoconfigure.exclude=

# --- DataSource PostgreSQL ---
# Sur GKE : Cloud SQL Auth Proxy tourne en sidecar et expose 127.0.0.1:5432
# En local : docker compose up -d postgres
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/kube_train
spring.datasource.username=${DB_USERNAME:kube_train_user}
spring.datasource.password=${DB_PASSWORD:kube_train_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# ddl-auto=validate : Hibernate vérifie que le schéma correspond aux entités (sans le modifier)
# Le schéma est géré par Flyway (migrations versionnées)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- HikariCP (pool de connexions) ---
# initialization-fail-timeout=-1 : ne pas faire échouer le démarrage si la DB n'est pas
# immédiatement disponible (le proxy Cloud SQL démarre en parallèle du pod principal).
# HikariCP retente la connexion en arrière-plan jusqu'à ce qu'elle réussisse.
spring.datasource.hikari.initialization-fail-timeout=-1

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# connect-retries : retenter la connexion N fois si le proxy n'est pas encore prêt
spring.flyway.connect-retries=10
spring.flyway.connect-retries-interval=5
