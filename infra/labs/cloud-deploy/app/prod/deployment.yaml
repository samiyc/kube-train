# Même release, autre profil → autre namespace + plus de replicas.
# C'est exactement ce que démontre la promotion : l'artefact ne change pas, la config si.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-cloud-deploy-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
  namespace: lab-cloud-deploy-prod
  labels:
    app: lab-app
    env: prod
spec:
  replicas: 2 # prod = plus de replicas (différence visible après promotion)
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
        env: prod
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
