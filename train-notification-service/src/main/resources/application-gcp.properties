# Profil GCP — actif sur GKE (SPRING_PROFILES_ACTIVE=gcp)

# Projet GCP
gcp.project-id=kube-train-project

# Kafka désactivé : remplacé par Pub/Sub en profil gcp.
# Exclure l'autoconfiguration évite toute tentative de connexion à localhost:9092
# et empêche le KafkaListenerContainerFactory de démarrer.
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
