# Déploiement GKE — train-notification-service
#
# ⚠️  Prérequis IAM (à exécuter une seule fois sur GCP) :
#
#   # Récupérer le SA du cluster (compute SA ou Workload Identity SA)
#   GCP_SA=$(gcloud iam service-accounts list \
#     --format="value(email)" \
#     --filter="email~kube-train OR email~compute" \
#     --project=kube-train-project | head -1)
#
#   # Accès subscriber pour la subscription Pub/Sub
#   gcloud pubsub subscriptions add-iam-policy-binding notification-subscription \
#     --member="serviceAccount:${GCP_SA}" \
#     --role="roles/pubsub.subscriber" \
#     --project=kube-train-project
#
#   # Accès publisher pour publier sur le topic (kube-train-api)
#   gcloud pubsub topics add-iam-policy-binding train-reservations \
#     --member="serviceAccount:${GCP_SA}" \
#     --role="roles/pubsub.publisher" \
#     --project=kube-train-project
#
# 🎯 Authentification automatique :
#   Sur GKE, Application Default Credentials (ADC) récupère automatiquement
#   les credentials depuis le metadata server → aucune clé JSON à gérer.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  labels:
    app: notification
spec:
  replicas: 1
  revisionHistoryLimit: 5  # Garde les 5 derniers ReplicaSets, supprime les anciens
  selector:
    matchLabels:
      app: notification-pod
  template:
    metadata:
      labels:
        app: notification-pod
      annotations:
        traffic.sidecar.istio.io/excludeInboundPorts: "15020"
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "169.254.169.254/32"
    spec:
      automountServiceAccountToken: false  # K8s SA token non requis (auth via GKE metadata server)
      # F4-J1 : SA dédié
      serviceAccountName: notification-sa
      # F4-J1 : hardening PSS restricted
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
      - name: notification-container
        image: europe-west1-docker.pkg.dev/kube-train-project/kube-train-repo/train-notification-service:d77cc45bfcda5de91020298920c3adc40561a9e1
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        # F4-J1 : securityContext container
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "gcp"
        - name: GCP_PROJECT_ID
          value: "kube-train-project"
        # Logs JSON structurés (ECS format) — Cloud Logging parse automatiquement
        - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
          value: "ecs"
        # OpenTelemetry — traces vers le OTel Collector (qui exporte vers Cloud Trace)
        - name: OTEL_SERVICE_NAME
          value: "train-notification-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector-service:4317"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "grpc"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "k8s.namespace.name=default,k8s.deployment.name=notification-deployment"
        - name: OTEL_METRICS_EXPORTER
          value: "none"
        - name: OTEL_LOGS_EXPORTER
          value: "none"
        # F4-J1 : /tmp writable pour Spring Boot (readOnlyRootFilesystem: true)
        - name: JAVA_TOOL_OPTIONS
          value: "-Djava.io.tmpdir=/tmp"

        # Le service n'expose pas d'endpoint public, mais les probes K8s
        # vérifient /actuator/health directement sur le pod.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          failureThreshold: 30
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 0
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 0
          periodSeconds: 5

        resources:
          requests:
            cpu: "100m"
            memory: "384Mi"
            ephemeral-storage: "512Mi"
          limits:
            cpu: "500m"
            memory: "640Mi"
