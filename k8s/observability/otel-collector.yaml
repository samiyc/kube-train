# OTel Collector — reçoit les traces OTLP des pods et les exporte vers Cloud Trace
#
# Architecture :
#   kube-train-api / notification-service
#       → OTLP gRPC (otel-collector-service:4317)
#       → OTel Collector (googlecloud exporter)
#       → Cloud Trace (GCP)
#
# Identité GCP : ServiceAccount dédié `otel-collector-sa` (jamais le KSA `default`).
# Le GSA, ses rôles (cloudtrace.agent + monitoring.metricWriter) et le binding
# Workload Identity sont gérés par Terraform (infra/iam.tf). L'annotation du KSA
# est portée par ce manifeste → aucune étape manuelle, survit aux rebuilds.
#
# Le collector utilise Application Default Credentials (ADC) via Workload Identity —
# même mécanisme que le Cloud SQL Auth Proxy et le Pub/Sub client.
#
# ⚠️ Prérequis GCP restant : l'API Cloud Trace doit être activée sur le projet
#   gcloud services enable cloudtrace.googleapis.com --project=kube-train-project
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kube-train-api'
              scrape_interval: 30s
              static_configs:
                - targets: ['kube-train-service:80']
              metrics_path: '/actuator/prometheus'

    processors:
      memory_limiter:
        limit_percentage: 75
        check_interval: 1s
      batch:
        timeout: 5s
        send_batch_size: 100

    exporters:
      googlecloud:
        project: kube-train-project
      debug:
        verbosity: basic

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [googlecloud, debug]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [googlecloud]
---
# KSA dédié, lié au GSA otel-collector-sa via Workload Identity (cf. infra/iam.tf).
# L'annotation doit être présente AVANT le démarrage du pod, sinon le collector
# n'obtient aucune identité GCP → PermissionDenied sur cloudtrace/monitoring.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  annotations:
    iam.gke.io/gcp-service-account: otel-collector-sa@kube-train-project.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector-sa
      # Workload Identity passe par le metadata server GKE, pas par le token projeté :
      # on peut donc garder l'automount désactivé (durcissement F4-J1).
      automountServiceAccountToken: false
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.100.0
        args:
          - "--config=/etc/otel/config.yaml"
        ports:
        - containerPort: 4317   # OTLP gRPC
        - containerPort: 4318   # OTLP HTTP
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
            ephemeral-storage: "256Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-service
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  type: ClusterIP
