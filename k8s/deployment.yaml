# Deployment Minikube — image locale (imagePullPolicy: Never)
# Pour GKE, utiliser deployment-gke.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-train-deployment
  labels:
    app: kube-train
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-train-pod
  template:
    metadata:
      labels:
        app: kube-train-pod
    spec:
      automountServiceAccountToken: false
      # F4-J1 : SA dédié (1 identité par workload, principe du moindre privilège)
      serviceAccountName: kube-train-api-sa
      # F4-J1 : hardening PSS restricted (runAsNonRoot, readOnlyRootFilesystem, drop ALL)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      # F4-J1 : init container — attend PostgreSQL avant de démarrer l'API
      # ⚠️ Pattern Minikube uniquement (postgres-service séparé)
      # Sur GKE, ne pas attendre 127.0.0.1:5432 (cloud-sql-proxy est un sidecar → deadlock)
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "PostgreSQL indisponible, attente..."
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
      - name: api-container
        image: kube-train-api:v5  # 👈 Changer la version de l'image ici
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        #HPA
        resources:
          requests:
            cpu: "200m"     # Il réserve 0.2 CPU au démarrage
            memory: "256Mi" # Il réserve 256 Mo de RAM
            ephemeral-storage: "1Gi"
          limits:
            cpu: "500m"     # Il ne pourra jamais dépasser 0.5 CPU (sinon il est bridé)
            memory: "512Mi" # S'il dépasse 512 Mo, Kubernetes le tue (OOMKilled)
        
        #Pod startup check
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 15   # Attendre 15s avant de commencer à vérifier (laisser le temps à Java de boot)
          periodSeconds: 10         # Vérifier toutes les 10s
        #Pod alive check
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10   # Commencer à vérifier après 10s
          periodSeconds: 5          # Vérifier souvent
          failureThreshold: 3       # Si ça échoue 3 fois, on coupe le trafic
        
        # Injection en masse (ConfigMap + Secrets)
        envFrom:
          - configMapRef:
              name: kube-train-config
          - secretRef:
              name: kube-train-secrets
        
        # Injection manuelle (CORRECTION 2 : Mapping explicite)
        env:
        - name: TRAIN_API_KEY  # 👈 On renomme ici pour matcher "train.api.key" du Java
          valueFrom:
            secretKeyRef:
              name: kube-train-secrets
              key: API_KEY # La clé DANS le secret reste "API_KEY", c'est juste le nom de la variable qui change
        # OTel désactivé en Minikube (pas de OTel Collector local)
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        # F4-J1 : /tmp writable pour Spring Boot (readOnlyRootFilesystem: true)
        - name: JAVA_TOOL_OPTIONS
          value: "-Djava.io.tmpdir=/tmp"