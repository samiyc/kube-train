# F4-J1 : LimitRange + ResourceQuota pour le namespace default
#
# LimitRange : injecte des defaults CPU/mémoire si un container n'en spécifie pas,
#              et pose des bornes min/max par container.
#
# ResourceQuota : plafond global du namespace (nombre de pods, mémoire totale).
#
# Rappel :
#   - LimitRange agit par objet individuel (container)
#   - ResourceQuota plafonne la consommation agrégée du namespace
#
# Valeurs GKE + Istio (F4-J4) :
#   - Steady state : 3 pods (1 par déploiement), chacun avec istio-proxy sidecar
#   - Rolling update simultané max : 3 × 2 = 6 pods (notification + otel sans maxSurge: 0)
#   - limits.memory stable : kube-train(1.4Gi) + notification(1.1Gi) + otel(~1Gi) ≈ 3.5Gi
#   - Marges incluses pour rolling updates partiels
#   ⚠️  Quota ≠ coût : le coût GKE Autopilot dépend des requests des pods, pas du quota
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kube-train-default-limits
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 768Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kube-train-quota
spec:
  hard:
    pods: "8"            # 3 steady state + 3 rolling update + 2 marge
    limits.memory: 6Gi   # 3.5Gi stable + headroom rolling update
    requests.cpu: "3"    # ~2.1 CPU steady state (750m + 600m + 700m) + marge
