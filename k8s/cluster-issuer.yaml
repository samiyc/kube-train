# ClusterIssuer Let's Encrypt — émet des certificats TLS gratuits via ACME HTTP01.
# Setup manuel unique (comme cert-manager lui-même) — NE PAS mettre dans le pipeline CI/CD.
# Sur GKE Autopilot le webhook cert-manager nécessite --validate=false :
#   sed "s|LETSENCRYPT_EMAIL_PLACEHOLDER|email@example.com|g" cluster-issuer.yaml | kubectl apply --validate=false -f -
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: LETSENCRYPT_EMAIL_PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          ingressClassName: nginx
