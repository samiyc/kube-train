# Deployment GKE — image depuis Artifact Registry
# Pour Minikube, utiliser deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-train-deployment
  labels:
    app: kube-train
spec:
  replicas: 1  # GKE Autopilot quota gratuit : 1 replica au démarrage
  # Quota limité : on tue l'ancien pod AVANT de créer le nouveau (évite 2 pods simultanés)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # Ne pas créer de pod supplémentaire pendant la mise à jour
      maxUnavailable: 1  # Autoriser 1 pod indisponible (l'ancien se termine en premier)
  selector:
    matchLabels:
      app: kube-train-pod
  template:
    metadata:
      labels:
        app: kube-train-pod
    spec:
      containers:
      - name: api-container
        image: IMAGE_TAG_PLACEHOLDER
        # GKE pull depuis Artifact Registry (auth gérée automatiquement par GKE)
        # IMAGE_TAG_PLACEHOLDER est remplacé dynamiquement par GitHub Actions (git SHA)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        
        #HPA
        resources:
          requests:
            cpu: "200m"     # Il réserve 0.2 CPU au démarrage
            memory: "256Mi" # Il réserve 256 Mo de RAM
          limits:
            cpu: "500m"     # Il ne pourra jamais dépasser 0.5 CPU (sinon il est bridé)
            memory: "512Mi" # S'il dépasse 512 Mo, Kubernetes le tue (OOMKilled)
        
        # Attend que l'app soit démarrée avant d'activer liveness/readiness.
        # failureThreshold * periodSeconds = 30 * 5 = 150s max pour démarrer.
        # Tant que la startupProbe n'a pas réussi, la livenessProbe ne s'exécute pas.
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          failureThreshold: 30  # 30 tentatives max
          periodSeconds: 5      # toutes les 5s → 150s max pour démarrer

        #Pod alive check (KO => Dead, Reboot pod)
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3   # 3 échecs consécutifs → redémarrage du pod

        #Pod ready check (KO => Overload, Retire le pod du Service)
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 5
          failureThreshold: 3   # 3 échecs → plus de trafic vers ce pod
        
        # Injection en masse (ConfigMap + Secrets)
        envFrom:
          - configMapRef:
              name: kube-train-config
          - secretRef:
              name: kube-train-secrets
        
        # Injection manuelle (Mapping explicite)
        env:
        - name: TRAIN_API_KEY  # On renomme ici pour matcher "train.api.key" du Java
          valueFrom:
            secretKeyRef:
              name: kube-train-secrets
              key: API_KEY # La clé DANS le secret reste "API_KEY", c'est juste le nom de la variable qui change
        - name: SPRING_PROFILES_ACTIVE
          value: "postgres,gcp"
        - name: GCP_PROJECT_ID
          value: "kube-train-project"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: kube-train-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kube-train-secrets
              key: DB_PASSWORD
        # Logs JSON structurés (ECS format) — Cloud Logging parse automatiquement
        # le champ "log.level" comme severity (INFO, WARN, ERROR).
        # Désactivé en local (application.properties) pour garder des logs lisibles.
        - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
          value: "ecs"

      # Sidecar Cloud SQL Auth Proxy
      # Intercepte les connexions JDBC sur 127.0.0.1:5432 et les route de façon sécurisée vers Cloud SQL.
      # Avantages par rapport à une IP publique :
      #   - Pas d'IP whitelist à gérer
      #   - Chiffrement TLS automatique
      #   - Auth via Workload Identity (pas de mot de passe de connexion proxy)
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
        args:
          - "--structured-logs"         # Logs JSON (compatibles Cloud Logging)
          - "--port=5432"               # Port d'écoute local du proxy
          - "kube-train-project:europe-west1:kube-train-db"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          runAsNonRoot: true
