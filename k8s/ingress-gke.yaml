# Ingress GKE — HTTPS avec Let's Encrypt via cert-manager et nginx-ingress.
# Host basé sur l'IP fixe du nginx-ingress LoadBalancer (34.78.39.236).
# Si l'IP change (recréation cluster), mettre à jour ici et push → ArgoCD sync.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-train-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.34.78.39.236.nip.io
    secretName: kube-train-tls   # cert-manager stocke le certificat dans ce Secret
  rules:
  - host: api.34.78.39.236.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-train-service
            port:
              number: 80
