# Network Policy — Autorise le traffic entrant vers kube-train-api
#
# Sources autorisées :
#   1. Traffic externe (LoadBalancer, clients HTTP, health probes kubelet)
#   2. Pods du namespace (OTel Collector, probes internes)
#   3. Ingress Controller nginx (si utilisé)
#
# Port autorisé : 8080 (Spring Boot)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-api
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: kube-train-pod
  policyTypes:
    - Ingress
  ingress:
    # Autorise le traffic externe (LoadBalancer, health probes kubelet, clients)
    # Sur GKE, le LoadBalancer et les kubelet probes viennent d'IPs hors-cluster
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
    # Autorise le traffic depuis le namespace ingress-nginx (si Ingress utilisé)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Autorise le traffic intra-namespace (OTel scrape, debug pods)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
