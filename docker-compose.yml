# Docker Compose — Infrastructure locale pour kube-train
#
# Services :
#   kafka    — Kafka KRaft (sans Zookeeper), port 9092
#   postgres — PostgreSQL 15, port 5432 (profil Spring "postgres")
#   jaeger   — Jaeger all-in-one, UI :16686, OTLP gRPC :4317 (observabilité locale J2)
#   keycloak — Keycloak 24, UI :8180 (OAuth2/OIDC locale J4)
#
# Usage :
#   docker compose up -d            # Démarrer tous les services
#   docker compose up -d kafka      # Démarrer Kafka uniquement
#   docker compose up -d postgres   # Démarrer PostgreSQL uniquement
#   docker compose up -d jaeger     # Démarrer Jaeger uniquement (traces locales)
#   docker compose up -d keycloak   # Démarrer Keycloak (auth OAuth2 locale)
#   docker compose logs -f          # Voir les logs
#   docker compose down             # Arrêter
#   docker compose down -v          # Arrêter + supprimer les données

volumes:
  postgres-data:

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-kube-train
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # ://:port (sans host) = bind sur toutes les interfaces sans 0.0.0.0 explicite
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Replication factor = 1 car un seul nœud (en prod = 3 minimum)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # ID du cluster (fixe pour éviter de regénérer à chaque restart)
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  postgres:
    image: postgres:15
    container_name: postgres-kube-train
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kube_train
      POSTGRES_USER: kube_train_user
      POSTGRES_PASSWORD: kube_train_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Jaeger all-in-one — collecteur de traces pour le développement local
  # UI : http://localhost:16686
  # OTLP gRPC : localhost:4317 (même port que le OTel Collector sur GKE)
  # Usage : docker compose up -d jaeger
  #         Lancer l'app avec : OTEL_SERVICE_NAME=kube-train-api \
  #                             OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \
  #                             java -javaagent:opentelemetry-javaagent.jar -jar app.jar
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger-kube-train
    ports:
      - "16686:16686"   # UI Jaeger
      - "4317:4317"     # OTLP gRPC (même port que OTel Collector GKE)
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # Keycloak — Serveur d'identité OAuth2/OIDC pour le développement local
  # UI Admin : http://localhost:8180 (admin/admin)
  # Realm kube-train : importé automatiquement au démarrage
  # Token endpoint : POST http://localhost:8180/realms/kube-train/protocol/openid-connect/token
  # Usage : docker compose up -d keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak-kube-train
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
