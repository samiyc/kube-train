name: CI/CD — Build & Deploy to GKE

on:
  push:
    branches: [main]
    # Ignore les commits de mise à jour de tags (évite boucle infinie CI → commit → CI)
    paths-ignore:
      - '**/deployment-gke.yaml'
      - '**/notification-deployment-gke.yaml'

# Empêche deux déploiements en parallèle (le second attend la fin du premier)
concurrency:
  group: deploy-gke
  cancel-in-progress: false

permissions:
  contents: write  # Requis pour le commit des image tags (GitOps)
  id-token: write  # Requis pour Workload Identity Federation

env:
  PROJECT_ID: kube-train-project
  REGION: europe-west1
  GKE_CLUSTER: kube-train-cluster
  IMAGE: europe-west1-docker.pkg.dev/kube-train-project/kube-train-repo/kube-train-api
  IMAGE_NOTIFICATION: europe-west1-docker.pkg.dev/kube-train-project/kube-train-repo/train-notification-service
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Évite le warning Node.js 20 deprecated

jobs:
  test:
    name: Tests Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Lancer les tests kube-train-api (génère et installe les stubs de contrats)
        run: ./mvnw install --no-transfer-progress
        working-directory: kube-train-api

      - name: Lancer les tests notification-service (contrats consumer + tests unitaires)
        run: ./mvnw test --no-transfer-progress
        working-directory: train-notification-service

  build:
    name: Build & Push images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/399291708401/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@kube-train-project.iam.gserviceaccount.com

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & Push de l'image Docker (kube-train-api)
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            kube-train-api/
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build & Push de l'image Docker (notification-service)
        run: |
          docker build \
            -t ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }} \
            train-notification-service/
          docker push ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }}

      # Trivy — Scan de vulnérabilités sur l'image Docker (OWASP / supply chain security)
      # Échoue le build si vulnérabilités CRITICAL détectées (HIGH = warning seulement)
      - name: Trivy — Scan vulnérabilités image API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Trivy — Scan vulnérabilités image Notification
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  deploy:
    name: Deploy to GKE
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/399291708401/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@kube-train-project.iam.gserviceaccount.com

      # Vérifie que le cluster existe avant de tenter le déploiement.
      # Si le cluster a été supprimé (économie de crédits le week-end), le job est ignoré (skipped)
      # plutôt que d'échouer — le build reste vert et les images sont déjà pushées.
      - name: Vérifier que le cluster GKE existe
        id: cluster_check
        run: |
          if gcloud container clusters describe ${{ env.GKE_CLUSTER }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --quiet 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Cluster ${{ env.GKE_CLUSTER }} introuvable — déploiement ignoré."
          fi

      - name: Récupérer les credentials GKE
        if: steps.cluster_check.outputs.exists == 'true'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.REGION }}

      # Workload Identity — annotation sur le K8s SA "default"
      # Perdue à chaque re-création de cluster (ressource K8s, pas GCP).
      # --overwrite rend la commande idempotente (safe même si déjà annotée).
      # Sans cette annotation, le Cloud SQL Auth Proxy reçoit un token sans identité GCP → 403.
      - name: Configurer Workload Identity (annoter le K8s SA default)
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          kubectl annotate serviceaccount default \
            iam.gke.io/gcp-service-account=399291708401-compute@developer.gserviceaccount.com \
            --namespace=default \
            --overwrite

      # Lit le secret depuis GCP Secret Manager et crée/met à jour le K8s secret.
      # Pattern "upsert" : --dry-run=client -o yaml | kubectl apply -f -
      # → crée si absent, met à jour si présent (idempotent, safe en CI/CD)
      # GCP Secret Manager est la source de vérité — plus besoin de "kubectl create secret" manuellement.
      - name: Synchroniser le K8s secret depuis GCP Secret Manager
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          API_KEY=$(gcloud secrets versions access latest \
            --secret=api-key \
            --project=${{ env.PROJECT_ID }})
          echo "::add-mask::$API_KEY"

          DB_USERNAME=$(gcloud secrets versions access latest \
            --secret=db-username \
            --project=${{ env.PROJECT_ID }})
          echo "::add-mask::$DB_USERNAME"

          DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=db-password \
            --project=${{ env.PROJECT_ID }})
          echo "::add-mask::$DB_PASSWORD"

          kubectl create secret generic kube-train-secrets \
            --from-literal=API_KEY="$API_KEY" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Déployer sur GKE
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          # Remplace le tag d'image actuel (SHA précédent ou placeholder) par le nouveau
          sed "s|image: .*kube-train-api.*|image: ${{ env.IMAGE }}:${{ github.sha }}|g" \
            k8s/deployment-gke.yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

          # Déployer le notification-service
          sed "s|image: .*train-notification-service.*|image: ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }}|g" \
            k8s/notification-deployment-gke.yaml | kubectl apply -f -

          # Déployer l'OTel Collector (reçoit OTLP des pods → exporte vers Cloud Trace)
          kubectl apply -f k8s/otel-collector.yaml

          # Network Policies (zero-trust : deny all + allow explicite)
          kubectl apply -f k8s/network-policy-default-deny.yaml
          kubectl apply -f k8s/network-policy-api.yaml
          kubectl apply -f k8s/network-policy-otel.yaml

          # Ingress HTTPS (host hardcodé dans le fichier, plus de sed placeholder)
          kubectl apply -f k8s/ingress-gke.yaml

      - name: Vérifier le déploiement kube-train-api
        if: steps.cluster_check.outputs.exists == 'true'
        run: kubectl rollout status deployment/kube-train-deployment --timeout=5m

      - name: Vérifier le déploiement notification-service
        if: steps.cluster_check.outputs.exists == 'true'
        run: kubectl rollout status deployment/notification-deployment --timeout=5m

      # Applique l'Ingress HTTPS si nginx-ingress est installé.
      # L'host nip.io est maintenant hardcodé dans ingress-gke.yaml (GitOps).
      # Si nginx-ingress n'est pas installé (ex: après recréation cluster), ce step est ignoré.
      - name: Déployer l'Ingress HTTPS (nip.io)
        if: steps.cluster_check.outputs.exists == 'true'
        run: |
          if ! kubectl get namespace ingress-nginx &>/dev/null; then
            echo "⚠️ nginx-ingress non installé — Ingress ignoré. Réinstaller manuellement si besoin."
            exit 0
          fi
          kubectl apply -f k8s/ingress-gke.yaml

  # ─────────────────────────────────────────────────────────────────────────────
  # GitOps — Commit les image tags dans les manifests
  # ArgoCD détecte le changement et synchronise le cluster automatiquement.
  # Ce job remplacera le job "deploy" une fois ArgoCD actif (migration progressive).
  # ─────────────────────────────────────────────────────────────────────────────
  update-manifests:
    name: GitOps — Commit image tags
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Token par défaut pour push (permissions: contents: write)
          token: ${{ github.token }}

      - name: Mettre à jour les tags d'image dans les manifests
        run: |
          # deployment-gke.yaml : remplace le placeholder OU l'ancien tag
          sed -i "s|image: IMAGE_TAG_PLACEHOLDER|image: ${{ env.IMAGE }}:${{ github.sha }}|g" \
            k8s/deployment-gke.yaml
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|g" \
            k8s/deployment-gke.yaml

          # notification-deployment-gke.yaml : idem
          sed -i "s|image: NOTIFICATION_IMAGE_PLACEHOLDER|image: ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }}|g" \
            k8s/notification-deployment-gke.yaml
          sed -i "s|image: ${{ env.IMAGE_NOTIFICATION }}:.*|image: ${{ env.IMAGE_NOTIFICATION }}:${{ github.sha }}|g" \
            k8s/notification-deployment-gke.yaml

          echo "✅ Tags mis à jour → ${{ github.sha }}"

      - name: Commit et push (GitOps)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment-gke.yaml k8s/notification-deployment-gke.yaml
          # Ne commit que s'il y a un diff (première fois ou tag différent)
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement de tag — skip commit"
          else
            git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
            git push
            echo "✅ Manifests committés → ArgoCD va synchroniser"
          fi
